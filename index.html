<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumpling & Boba Index 🥟🧋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #4A3340;
      --ink-mid:    #9A7F8C;
      --bg:         #FFF6F0;
      --dot:        #FBE3D8;
      --card:       #FFFFFF;
      --soft:       #FFF1EA;
      --line:       #F6DCD0;
      --accent:     #FF8F7A;
      --accent-dk:  #F0705A;
      --accent-lt:  #FFE1D9;
      --shadow:     rgba(170,100,110,0.16);
      --tier-S:     #FF9AA8;
      --tier-A:     #FFC48C;
      --tier-B:     #FFE38A;
      --tier-C:     #B6E8A6;
      --tier-D:     #A9D3FF;
      --p0:         #FF8F7A;
      --p1:         #9B86E8;
      color-scheme: light;
    }
    body.boba {
      --bg:        #F7F3FF;
      --dot:       #E9E0FB;
      --soft:      #F3EEFF;
      --line:      #E3D8F7;
      --accent:    #9B86E8;
      --accent-dk: #8069D6;
      --accent-lt: #E6DEFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Fredoka', ui-rounded, -apple-system, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px);
      background-size: 26px 26px;
      color: var(--ink); min-height: 100vh; transition: background-color 0.3s;
    }
    button { font-family: inherit; }

    /* Header */
    header { padding: 14px 16px 0; max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 6px; font-size: 1.35rem; font-weight: 700; white-space: nowrap; }
    .logo svg { width: 38px; height: 38px; }
    nav { display: flex; gap: 4px; background: var(--card); padding: 5px; border-radius: 999px; box-shadow: 0 3px 14px var(--shadow); }
    nav button { background: none; border: none; color: var(--ink-mid); padding: 9px 16px; border-radius: 999px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
    nav button:hover { color: var(--ink); }
    nav button.active { color: #fff; background: var(--accent); box-shadow: 0 3px 10px var(--shadow); }

    main { max-width: 820px; margin: 0 auto; padding: 22px 16px 80px; }

    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .list-head-title { display: flex; align-items: center; gap: 10px; }
    .list-head-title svg { width: 52px; height: 52px; flex-shrink: 0; animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
    h2 { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
    .list-sub { font-size: 0.88rem; color: var(--ink-mid); margin-top: 3px; }
    .section-label { font-size: 0.95rem; font-weight: 700; margin: 30px 4px 10px; display: flex; align-items: baseline; gap: 8px; }
    .section-label small { font-weight: 500; color: var(--ink-mid); font-size: 0.82rem; }

    /* Tier board */
    .board { background: var(--card); border-radius: 26px; padding: 8px; box-shadow: 0 6px 24px var(--shadow); display: flex; flex-direction: column; gap: 8px; }
    .tier-row { display: flex; min-height: 86px; background: var(--soft); border-radius: 20px; overflow: hidden; }
    .tier-label { width: 70px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,0.5); border-radius: 20px; margin: 6px; }
    .tier-items { flex: 1; display: flex; flex-wrap: wrap; align-content: center; gap: 8px; padding: 8px 8px 8px 2px; }
    .tier-empty { font-size: 0.85rem; color: var(--ink-mid); opacity: 0.7; padding-left: 4px; }

    .item { background: var(--card); border-radius: 16px; padding: 9px 12px; cursor: pointer; max-width: 230px; box-shadow: 0 2px 8px var(--shadow); transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s; text-align: left; border: none; color: inherit; font: inherit; }
    .item:hover { transform: translateY(-2px) rotate(-1deg) scale(1.03); box-shadow: 0 6px 16px var(--shadow); }
    .item-name { font-size: 0.95rem; font-weight: 600; line-height: 1.2; }
    .item-place { font-size: 0.78rem; color: var(--ink-mid); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .vote { display: inline-flex; align-items: center; gap: 3px; font-size: 0.72rem; font-weight: 600; background: var(--soft); border-radius: 999px; padding: 2px 7px 2px 2px; }
    .vote-dot { width: 17px; height: 17px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; }
    .vote-tier { width: 17px; height: 17px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700; color: var(--ink); }
    .price { font-size: 0.72rem; font-weight: 600; color: var(--ink-mid); margin-left: 2px; }

    /* Want to try shelf */
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .wish { background: var(--card); border: 2.5px dashed var(--line); border-radius: 18px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: border-color 0.2s, transform 0.2s; }
    .wish:hover { border-color: var(--accent); transform: translateY(-2px); }
    .wish .item-name::before { content: '✨ '; }
    .shelf-empty { background: var(--card); border-radius: 18px; padding: 18px; color: var(--ink-mid); font-size: 0.9rem; text-align: center; border: 2.5px dashed var(--line); }

    /* Buttons */
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px 20px; border-radius: 999px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; box-shadow: 0 4px 0 var(--accent-dk); }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dk); }
    .btn-ghost { background: none; border: 2px solid var(--line); color: var(--ink-mid); padding: 10px 16px; border-radius: 999px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--ink); }
    .btn-danger { background: none; border: none; color: #D9534F; padding: 10px 6px; font-size: 0.92rem; font-weight: 600; cursor: pointer; margin-right: auto; }
    .btn-danger:hover { text-decoration: underline; }

    /* Modal sheet */
    .overlay { position: fixed; inset: 0; background: rgba(74,51,64,0.35); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .overlay.open { display: flex; }
    .sheet { background: var(--card); border-radius: 28px; padding: 22px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; box-shadow: 0 16px 50px rgba(74,51,64,0.3); animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .sheet h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label, .label { font-size: 0.82rem; font-weight: 600; color: var(--ink-mid); }
    input, textarea { padding: 11px 14px; border: 2px solid var(--line); border-radius: 14px; font-size: 1rem; background: var(--soft); color: var(--ink); outline: none; font-family: inherit; width: 100%; }
    input:focus, textarea:focus { border-color: var(--accent); background: var(--card); }
    textarea { resize: vertical; min-height: 64px; }
    .price-wrap { position: relative; }
    .price-wrap span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-mid); font-weight: 600; }
    .price-wrap input { padding-left: 28px; }

    .segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
    .segment button { border: none; background: none; padding: 9px; border-radius: 999px; font-size: 0.95rem; font-weight: 600; color: var(--ink-mid); cursor: pointer; transition: all 0.2s; }
    .segment button.active { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px var(--shadow); }

    .rate-box { background: var(--soft); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .rate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rate-who { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.95rem; min-width: 0; }
    .rate-who .vote-dot { width: 24px; height: 24px; font-size: 0.8rem; flex-shrink: 0; }
    .combined { font-size: 0.85rem; color: var(--ink-mid); text-align: center; }
    .combined b { color: var(--ink); }

    .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { border: 2.5px solid transparent; border-radius: 12px; min-width: 38px; height: 38px; font-size: 1rem; font-weight: 700; cursor: pointer; color: var(--ink); background: var(--card); transition: transform 0.15s; }
    .pill.tier { opacity: 0.45; }
    .pill.tier.selected { opacity: 1; border-color: var(--ink); transform: scale(1.1); }
    .pill.opt { padding: 0 12px; font-size: 0.88rem; font-weight: 600; background: var(--soft); }
    .pill.opt.selected { background: var(--accent); color: #fff; }
    .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 8px; }
    .maps-link { font-size: 0.88rem; color: var(--accent-dk); font-weight: 600; text-decoration: none; }
    .hidden { display: none !important; }

    .storage-note { font-size: 0.82rem; color: var(--ink-mid); text-align: center; margin-top: 26px; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(90px); background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 999px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.2); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; pointer-events: none; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      header { justify-content: center; }
      .logo { font-size: 1.2rem; }
      nav button { padding: 8px 13px; font-size: 0.9rem; }
      .tier-label { width: 48px; font-size: 1.5rem; margin: 5px; }
      .item { max-width: 100%; }
      h2 { font-size: 1.3rem; }
      .list-head-title svg { width: 42px; height: 42px; }
      .btn-primary { padding: 11px 16px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .rate-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span id="logo-art"></span>The Snack Index</div>
  <nav>
    <button onclick="showList('dumplings')" id="nav-dumplings" class="active">🥟 Dumplings</button>
    <button onclick="showList('boba')" id="nav-boba">🧋 Bubble Tea</button>
  </nav>
</header>

<main>
  <div class="list-head">
    <div class="list-head-title">
      <span id="list-art"></span>
      <div>
        <h2 id="list-title"></h2>
        <div class="list-sub" id="list-sub"></div>
      </div>
    </div>
    <button class="btn-primary" onclick="openSheet()">＋ Add</button>
  </div>
  <div class="board" id="board"></div>

  <div class="section-label">📝 Want to try <small id="wish-count"></small></div>
  <div class="shelf" id="shelf"></div>

  <div class="storage-note" id="storage-note"></div>
</main>

<!-- Add / edit sheet -->
<div class="overlay" id="overlay" onclick="if (event.target === this) closeSheet()">
  <div class="sheet">
    <h3 id="sheet-title">Add</h3>
    <div class="segment">
      <button type="button" id="seg-tried" onclick="setTried(true)">😋 Tried it</button>
      <button type="button" id="seg-wish" onclick="setTried(false)">✨ Want to try</button>
    </div>
    <div class="form-group">
      <label for="f-name" id="f-name-label">Name</label>
      <input type="text" id="f-name" />
    </div>
    <div class="form-group">
      <label for="f-place">Place</label>
      <input type="text" id="f-place" placeholder="e.g. Din Tai Fung, Chinatown" />
    </div>

    <div id="tried-fields">
      <div class="label" style="margin-bottom:6px;">Ratings</div>
      <div class="rate-box">
        <div id="f-ratings"></div>
        <div class="combined" id="f-combined"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" />
        </div>
        <div class="form-group">
          <label for="f-price">Price</label>
          <div class="price-wrap"><span>$</span><input type="number" id="f-price" min="0" step="0.5" inputmode="decimal" placeholder="0.00" /></div>
        </div>
      </div>
      <div id="boba-fields">
        <div class="form-group">
          <div class="label">Sugar</div>
          <div class="pill-row" id="f-sugar"></div>
        </div>
        <div class="form-group">
          <div class="label">Ice</div>
          <div class="pill-row" id="f-ice"></div>
        </div>
        <div class="form-group">
          <label for="f-toppings">Toppings</label>
          <input type="text" id="f-toppings" placeholder="e.g. Pearls, cheese foam" />
        </div>
      </div>
      <div class="form-group" id="ordered-group">
        <label for="f-ordered">What we ordered</label>
        <input type="text" id="f-ordered" placeholder="e.g. 10 pork xiaolongbao, chilli wontons" />
      </div>
    </div>

    <div class="form-group">
      <label for="f-maps">Google Maps link (optional)</label>
      <input type="url" id="f-maps" placeholder="https://maps.google.com/..." />
      <a id="f-maps-open" class="maps-link hidden" target="_blank" rel="noopener">📍 Open in Maps</a>
    </div>
    <div class="form-group">
      <label for="f-notes">Notes (optional)</label>
      <textarea id="f-notes" placeholder="Would you go back?"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-danger" id="delete-btn" onclick="deleteItem()">Delete</button>
      <button class="btn-ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn-primary" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  /* ================= CONFIG =================
     Leave FIREBASE_CONFIG as null to save on this device only (localStorage).
     Paste a Firebase web config here to share the lists between both phones. */
  const FIREBASE_CONFIG = null;

  const PEOPLE = ['Luca', 'Emma'];

  const ART = {
    dumplings: `<svg viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="32" cy="54" rx="22" ry="4" fill="#000" opacity="0.07"/>
      <path d="M6 44c0-14 12-26 26-26s26 12 26 26c0 5-4 8-9 8H15c-5 0-9-3-9-8z" fill="#FFF8EC" stroke="#4A3340" stroke-width="2.5"/>
      <path d="M22 22c1 5 1 8 0 11M32 18v14M42 22c-1 5-1 8 0 11" stroke="#4A3340" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <circle cx="24" cy="41" r="2.4" fill="#4A3340"/><circle cx="40" cy="41" r="2.4" fill="#4A3340"/>
      <path d="M29 44q3 3 6 0" stroke="#4A3340" stroke-width="2" stroke-linecap="round" fill="none"/>
      <ellipse cx="19" cy="46" rx="3.5" ry="2" fill="#FF9AA8" opacity="0.7"/><ellipse cx="45" cy="46" rx="3.5" ry="2" fill="#FF9AA8" opacity="0.7"/>
    </svg>`,
    boba: `<svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M38 2l-6 18" stroke="#4A3340" stroke-width="5" stroke-linecap="round"/>
      <path d="M38 2l-6 18" stroke="#FF9AA8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M13 18h38l-5 40c-.4 3-3 5-6 5H24c-3 0-5.6-2-6-5z" fill="#E6D3C2" stroke="#4A3340" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M10 15h44v6H10z" fill="#C9B6F2" stroke="#4A3340" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="54" r="3" fill="#4A3340"/><circle cx="32" cy="56" r="3" fill="#4A3340"/><circle cx="40" cy="54" r="3" fill="#4A3340"/><circle cx="28" cy="49" r="3" fill="#4A3340"/><circle cx="37" cy="49" r="3" fill="#4A3340"/>
      <circle cx="26" cy="33" r="2.4" fill="#4A3340"/><circle cx="38" cy="33" r="2.4" fill="#4A3340"/>
      <path d="M29 36q3 3 6 0" stroke="#4A3340" stroke-width="2" stroke-linecap="round" fill="none"/>
      <ellipse cx="21" cy="38" rx="3" ry="1.8" fill="#FF9AA8" opacity="0.7"/><ellipse cx="43" cy="38" rx="3" ry="1.8" fill="#FF9AA8" opacity="0.7"/>
    </svg>`,
  };

  const LISTS = {
    dumplings: { title: 'Dumpling Index', noun: 'dumpling', emoji: '🥟', nameLabel: 'Dumpling', placeholder: 'e.g. Pork & chive xiaolongbao' },
    boba:      { title: 'Bubble Tea Index', noun: 'bubble tea', emoji: '🧋', nameLabel: 'Drink', placeholder: 'e.g. Brown sugar milk tea' },
  };
  const TIERS = ['S', 'A', 'B', 'C', 'D'];
  const TIER_SCORE = { S: 5, A: 4, B: 3, C: 2, D: 1 };
  const SUGAR = ['0%', '25%', '50%', '75%', '100%'];
  const ICE = ['No ice', 'Less', 'Regular', 'Hot'];

  let currentList = localStorage.getItem('last_list') || 'dumplings';
  let allItems = [];
  let editing = null;          // item being edited, or null when adding
  let form = {};               // sheet state for pill-based fields

  /* ---- Storage: Firestore when configured, otherwise localStorage ---- */
  let store;
  if (FIREBASE_CONFIG) {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot }
      = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const db = getFirestore(initializeApp(FIREBASE_CONFIG));
    store = {
      shared: true,
      subscribe: cb => onSnapshot(collection(db, 'items'), snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() })))),
      add: data => addDoc(collection(db, 'items'), data),
      update: (id, data) => updateDoc(doc(db, 'items', id), data),
      remove: id => deleteDoc(doc(db, 'items', id)),
    };
  } else {
    const KEY = 'dumpling_boba_items';
    let listener = () => {};
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
    const write = items => { localStorage.setItem(KEY, JSON.stringify(items)); listener(items); };
    store = {
      shared: false,
      subscribe: cb => { listener = cb; cb(read()); },
      add: async data => write([...read(), { id: crypto.randomUUID(), ...data }]),
      update: async (id, data) => write(read().map(i => i.id === id ? { ...i, ...data } : i)),
      remove: async id => write(read().filter(i => i.id !== id)),
    };
  }

  store.subscribe(items => { allItems = items; render(); });

  /* ---- Scoring: each person's tier → average → combined tier ---- */
  function avgScore(ratings) {
    const vals = Object.values(ratings || {}).filter(t => TIER_SCORE[t]).map(t => TIER_SCORE[t]);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }
  function combinedTier(ratings) {
    const avg = avgScore(ratings);
    if (avg === null) return null;
    return TIERS.find(t => TIER_SCORE[t] === Math.round(avg));
  }

  /* ---- Navigation ---- */
  window.showList = function(name) {
    currentList = name;
    localStorage.setItem('last_list', name);
    document.body.classList.toggle('boba', name === 'boba');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-' + name).classList.add('active');
    render();
  };

  /* ---- Render ---- */
  function personDot(name) {
    const i = PEOPLE.indexOf(name);
    return `<span class="vote-dot" style="background:var(--p${i < 0 ? 0 : i})">${esc(name[0] || '?')}</span>`;
  }

  function render() {
    const cfg = LISTS[currentList];
    const items = allItems.filter(i => i.list === currentList);
    const tried = items.filter(i => i.tried !== false && combinedTier(i.ratings));
    const wishes = items.filter(i => !tried.includes(i));

    document.getElementById('logo-art').innerHTML = ART[currentList];
    document.getElementById('list-art').innerHTML = ART[currentList];
    document.getElementById('list-title').textContent = cfg.title;
    document.getElementById('list-sub').textContent = `${tried.length} ranked · ${wishes.length} on the wishlist`;
    document.getElementById('storage-note').textContent = store.shared
      ? '☁️ Synced between both phones'
      : '📱 Saved on this device only — add a Firebase config to share it';

    document.getElementById('board').innerHTML = TIERS.map(t => {
      const inTier = tried
        .filter(i => combinedTier(i.ratings) === t)
        .sort((a, b) => avgScore(b.ratings) - avgScore(a.ratings) || (a.createdAt || 0) - (b.createdAt || 0));
      const chips = inTier.map(i => {
        const votes = PEOPLE.filter(p => i.ratings?.[p]).map(p =>
          `<span class="vote">${personDot(p)}<span class="vote-tier" style="background:var(--tier-${i.ratings[p]})">${i.ratings[p]}</span></span>`
        ).join('');
        const price = i.price ? `<span class="price">$${fmtPrice(i.price)}</span>` : '';
        return `
          <button class="item" onclick="openSheet('${i.id}')">
            <div class="item-name">${esc(i.name)}</div>
            ${i.place ? `<div class="item-place">📍 ${esc(i.place)}</div>` : ''}
            <div class="item-meta">${votes}${price}</div>
          </button>`;
      }).join('');
      return `
        <div class="tier-row">
          <div class="tier-label" style="background:var(--tier-${t})">${t}</div>
          <div class="tier-items">${chips || '<span class="tier-empty">Nothing here yet</span>'}</div>
        </div>`;
    }).join('');

    document.getElementById('wish-count').textContent = wishes.length ? `${wishes.length} to go` : '';
    document.getElementById('shelf').innerHTML = wishes.length
      ? wishes.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map(i => `
          <button class="wish" onclick="openSheet('${i.id}')">
            <div class="item-name">${esc(i.name)}</div>
            ${i.place ? `<div class="item-place">📍 ${esc(i.place)}</div>` : ''}
          </button>`).join('')
      : `<div class="shelf-empty">Nothing on the wishlist — add a ${cfg.noun} you've heard about ${cfg.emoji}</div>`;
  }

  /* ---- Add / edit sheet ---- */
  function renderSheetPills() {
    document.getElementById('seg-tried').classList.toggle('active', form.tried);
    document.getElementById('seg-wish').classList.toggle('active', !form.tried);
    document.getElementById('tried-fields').classList.toggle('hidden', !form.tried);

    document.getElementById('f-ratings').innerHTML = PEOPLE.map((p, pi) => `
      <div class="rate-row">
        <div class="rate-who">${personDot(p)}${esc(p)}</div>
        <div class="pill-row">${TIERS.map(t =>
          `<button type="button" class="pill tier ${form.ratings[p] === t ? 'selected' : ''}" style="background:var(--tier-${t})" onclick="pickRating(${pi}, '${t}')">${t}</button>`
        ).join('')}</div>
      </div>`).join('');
    const combo = combinedTier(form.ratings);
    document.getElementById('f-combined').innerHTML = combo
      ? `Lands in <b>${combo} tier</b>${Object.keys(form.ratings).length > 1 ? ` (avg ${avgScore(form.ratings).toFixed(1)} / 5)` : ''}`
      : 'Tap a tier for each of you — tap again to clear';

    document.getElementById('f-sugar').innerHTML = SUGAR.map(s =>
      `<button type="button" class="pill opt ${form.sugar === s ? 'selected' : ''}" onclick="pickOpt('sugar', '${s}')">${s}</button>`).join('');
    document.getElementById('f-ice').innerHTML = ICE.map(s =>
      `<button type="button" class="pill opt ${form.ice === s ? 'selected' : ''}" onclick="pickOpt('ice', '${s}')">${s}</button>`).join('');
  }

  window.setTried = v => { form.tried = v; renderSheetPills(); };
  window.pickRating = (pi, t) => {
    const p = PEOPLE[pi];
    if (form.ratings[p] === t) delete form.ratings[p]; else form.ratings[p] = t;
    renderSheetPills();
  };
  window.pickOpt = (key, v) => { form[key] = form[key] === v ? '' : v; renderSheetPills(); };

  window.openSheet = function(id) {
    editing = id ? allItems.find(i => i.id === id) : null;
    const cfg = LISTS[currentList];
    const isBoba = currentList === 'boba';
    form = {
      tried: editing ? editing.tried !== false && !!combinedTier(editing.ratings) : true,
      ratings: { ...(editing?.ratings || {}) },
      sugar: editing?.sugar || '',
      ice: editing?.ice || '',
    };
    document.getElementById('sheet-title').textContent = editing ? `${cfg.emoji} Edit ${cfg.noun}` : `${cfg.emoji} Add a ${cfg.noun}`;
    document.getElementById('f-name-label').textContent = cfg.nameLabel;
    document.getElementById('f-name').placeholder = cfg.placeholder;
    document.getElementById('f-name').value = editing?.name || '';
    document.getElementById('f-place').value = editing?.place || '';
    document.getElementById('f-date').value = editing?.date || new Date().toLocaleDateString('en-CA');
    document.getElementById('f-price').value = editing?.price ?? '';
    document.getElementById('f-toppings').value = editing?.toppings || '';
    document.getElementById('f-ordered').value = editing?.ordered || '';
    document.getElementById('f-maps').value = editing?.mapsUrl || '';
    document.getElementById('f-notes').value = editing?.notes || '';
    document.getElementById('boba-fields').classList.toggle('hidden', !isBoba);
    document.getElementById('ordered-group').classList.toggle('hidden', isBoba);
    const mapsOpen = document.getElementById('f-maps-open');
    mapsOpen.classList.toggle('hidden', !editing?.mapsUrl);
    mapsOpen.href = editing?.mapsUrl || '#';
    document.getElementById('delete-btn').classList.toggle('hidden', !editing);
    renderSheetPills();
    document.getElementById('overlay').classList.add('open');
    if (!editing) document.getElementById('f-name').focus();
  };

  window.closeSheet = function() {
    document.getElementById('overlay').classList.remove('open');
    editing = null;
  };

  window.saveItem = async function() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { document.getElementById('f-name').focus(); return; }
    if (form.tried && !combinedTier(form.ratings)) { alert('Give it a tier from at least one of you (or move it to "Want to try").'); return; }
    const mapsUrl = document.getElementById('f-maps').value.trim();
    if (mapsUrl && !/^https?:\/\//.test(mapsUrl)) { alert('Maps link should start with https://'); return; }
    const price = parseFloat(document.getElementById('f-price').value);
    const data = {
      name,
      place: document.getElementById('f-place').value.trim(),
      tried: form.tried,
      ratings: form.tried ? form.ratings : {},
      date: form.tried ? document.getElementById('f-date').value : '',
      price: form.tried && price > 0 ? price : null,
      sugar: form.tried ? form.sugar : '',
      ice: form.tried ? form.ice : '',
      toppings: form.tried ? document.getElementById('f-toppings').value.trim() : '',
      ordered: form.tried ? document.getElementById('f-ordered').value.trim() : '',
      mapsUrl,
      notes: document.getElementById('f-notes').value.trim(),
    };
    try {
      const cfg = LISTS[currentList];
      if (editing) {
        await store.update(editing.id, data);
        showToast('Saved ✨');
      } else {
        await store.add({ ...data, list: currentList, createdAt: Date.now() });
        showToast(form.tried ? `${combinedTier(form.ratings)} tier ${cfg.emoji}` : `Added to the wishlist ${cfg.emoji}`);
      }
      closeSheet();
    } catch (e) {
      alert('Failed to save: ' + e.message);
    }
  };

  window.deleteItem = async function() {
    if (!editing || !confirm(`Delete "${editing.name}"?`)) return;
    await store.remove(editing.id);
    closeSheet();
    showToast('Deleted');
  };

  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeSheet(); });

  /* ---- Toast ---- */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function fmtPrice(n) { return Number.isInteger(n) ? n : n.toFixed(2); }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  window.showList(currentList);
</script>
</body>
</html>
